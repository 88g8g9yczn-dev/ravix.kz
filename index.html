<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAVIX Activation — Русификация и Казахизация авто</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 20px; line-height: 1.5; }
        .header { text-align: center; margin-bottom: 30px; padding-top: 10px; }
        .logo { font-size: 28px; font-weight: 800; color: #38bdf8; letter-spacing: 1px; }
        .subtitle { color: #94a3b8; font-size: 14px; margin-top: 5px; }
        .card { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #334155; }
        h2 { font-size: 18px; margin-bottom: 15px; color: #f1f5f9; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        select, input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 15px; margin-bottom: 15px; outline: none; }
        select:focus, input:focus { border-color: #38bdf8; }
        .badge { display: inline-block; background: #0284c7; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 4px; font-weight: 600; margin-left: 5px; }
        .btn-submit { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #2563eb; color: #fff; font-size: 16px; font-weight: 700; cursor: pointer; }
        .btn-submit:active { background: #1d4ed8; }
        .features { margin-top: 10px; }
        .feature-item { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #cbd5e1; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">RAVIX ACTIVATION</div>
        <div class="subtitle">Локализация и прошивка китайских авто 🇰🇿 🇷🇺</div>
    </div>

    <div class="card">
        <h2>Подбор прошивки</h2>
        
        <label>Марка автомобиля</label>
        <select id="brand">
            <option value="">Выберите марку</option>
            <option value="changan">Changan</option>
            <option value="chery">Chery</option>
            <option value="haval">Haval</option>
            <option value="jetour">Jetour</option>
            <option value="geely">Geely</option>
            <option value="jac">JAC</option>
            <option value="byd">BYD</option>
        </select>

        <label>Пакет локализации</label>
        <select id="lang">
            <option value="ru">Русский язык</option>
            <option value="kz">Казахский язык + Голосовой помощник 🇰🇿</option>
            <option value="full">Полный пакет (RU + KZ + Голос)</option>
        </select>

        <label>VIN-код автомобиля</label>
        <input type="text" placeholder="Например: LKG1234567890..." maxlength="17">

        <button class="btn-submit">Рассчитать стоимость</button>
    </div>

    <div class="card features">
        <h2>Преимущества RAVIX</h2>
        <div class="feature-item">✓ Полный казахский интерфейс и озвучка</div>
        <div class="feature-item">✓ Защита лицензии по VIN + Device ID</div>
        <div class="feature-item">✓ Самостоятельная установка или у мастера</div>
        <div class="feature-item">✓ Быстрая оплата через Kaspi Pay</div>
    </div>

</body>
</html>
